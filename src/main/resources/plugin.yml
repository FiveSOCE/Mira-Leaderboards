name: MiraLeaderboards
version: ${version}
main: com.mira.leaderboards.MiraLeaderboardsPlugin
api-version: '1.21'
author: FiveS
depend: [MiraCore]
softdepend: [PlaceholderAPI, MiraSeasons, MiraFactions, MiraPinata, MiraBounties, MiraPlaytime, MiraOutposts, MiraCrates]
commands:
  leaderboard:
    aliases: [lb]
    description: View a leaderboard
    usage: /leaderboard <board> [page]
  mleaderboard:
    aliases: [mlb]
    description: Manage Mira leaderboards
    usage: /mleaderboard <set|add|remove|clear|list|gui|scope|snapshot>
permissions:
  miraleaderboards.admin:
    default: op
